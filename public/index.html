<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinu AI - Link Device</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0e14; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-bottom: 8px; font-weight: 600; font-size: 20px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
        input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 15px; margin-bottom: 16px; outline: none; }
        input:focus { border-color: #58a6ff; }
        button { width: 100%; padding: 12px; background: #238636; border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; font-size: 15px; }
        button:hover { background: #2ea043; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .code-box { display: none; margin-top: 20px; padding: 16px; background: #0d1117; border: 1px dashed #30363d; border-radius: 8px; }
        .code-title { font-size: 12px; color: #8b949e; text-transform: uppercase; margin-bottom: 6px; }
        .code { font-size: 24px; font-family: monospace; font-weight: bold; color: #58a6ff; letter-spacing: 4px; cursor: pointer; }
        .copy-hint { font-size: 11px; color: #6e7681; margin-top: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Link Dinu Assistant</h2>
    <p>Enter your phone number with country code</p>
    
    <input type="text" id="phone" placeholder="947xxxxxxxx" autocomplete="off">
    <button id="btn" onclick="getPairCode()">Get Pairing Code</button>

    <div class="code-box" id="codeBox">
        <div class="code-title">Your Pairing Code</div>
        <div class="code" id="pairCode" onclick="copyCode()">--------</div>
        <div class="copy-hint">Click code to copy</div>
    </div>
</div>

<script>
    async function getPairCode() {
        const phoneInput = document.getElementById('phone');
        const btn = document.getElementById('btn');
        const codeBox = document.getElementById('codeBox');
        const pairCodeElem = document.getElementById('pairCode');
        
        let num = phoneInput.value.replace(/[^0-9]/g, '');
        if (!num || num.length < 10) {
            alert('Please enter a valid phone number with country code');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'Connecting...';

        try {
            const res = await fetch(`/pair?number=${num}`);
            const data = await res.json();

            if (data.code) {
                codeBox.style.display = 'block';
                pairCodeElem.innerText = data.code;
                btn.innerText = 'Code Received';
            } else {
                alert(data.error || 'Failed to generate code');
                btn.disabled = false;
                btn.innerText = 'Get Pairing Code';
            }
        } catch (e) {
            alert('Server error.');
            btn.disabled = false;
            btn.innerText = 'Get Pairing Code';
        }
    }

    function copyCode() {
        const code = document.getElementById('pairCode').innerText;
        if (code && code !== '--------') {
            navigator.clipboard.writeText(code);
            alert('Pairing code copied to clipboard!');
        }
    }
</script>

</body>
</html>
